[project]
name = "lerobot_camera_realsense_webrtc"
version = "0.1.0"
description = "LeRobot camera plugin for RealSense cameras via WebRTC REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lerobot",
    "aiortc>=1.6.0",
    "aiohttp>=3.9.0",
    "av>=10.0.0",
    "requests>=2.31.0",
    "opencv-python>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lerobot_camera_realsense_webrtc"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
lerobot_camera_realsense_webrtc = ["*.py"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_nova"
version = "0.1.0"
description = "Wandelbots Nova robot integration for LeRobot"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Stefan Wagner" }
]
keywords = ["robotics", "lerobot", "wandelbots", "nova"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lerobot",
    "wandelbots-api-client>=2.2.0",
    "websockets",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.urls]
Homepage = "https://github.com/wandelbotsgmbh/lerobot_robot_nova"

[tool.setuptools]
packages = ["lerobot_robot_nova"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
lerobot_robot_nova = ["*.py"]
